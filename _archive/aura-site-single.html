<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURA — The AI that turns marketing into clients</title>
<meta name="description" content="AURA is the artificial intelligence ecosystem that helps beauty centers, pharmacies, medical practices and beauty-industry businesses find new clients, manage contacts and increase sales.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #0a0a12;
  --bg-alt: #0f0f1a;
  --surface: #14141f;
  --surface-border: rgba(255,255,255,0.08);
  --text: #eef0f5;
  --text-muted: #a3a6b8;
  --pink: #ec1b7f;
  --pink-soft: #ff5fa8;
  --purple: #6c3ce9;
  --purple-soft: #9d7bff;
  --grad: linear-gradient(120deg, var(--pink) 0%, var(--purple) 100%);
  --radius: 18px;
  --max-width: 1180px;
  --font-display: "Poppins", sans-serif;
  --font-body: "Manrope", sans-serif;
}

*{ box-sizing: border-box; }
html{ scroll-behavior: smooth; }
body{
  margin:0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-weight: 400;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

h1,h2,h3,h4{
  font-family: var(--font-display);
  color: #fff;
  line-height: 1.2;
  margin: 0 0 0.6em;
}
h1{ font-weight:700; }
h2{ font-weight:600; font-size: clamp(1.7rem, 3vw, 2.5rem); }
h3{ font-weight:600; font-size: 1.2rem; }
h4{ font-weight:600; font-size: 1.05rem; }
p{ margin: 0 0 1em; color: var(--text-muted); }
a{ color: inherit; text-decoration:none; }

.container{
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 0 24px;
}
.container.narrow{ max-width: 760px; }
.container.center{ text-align:center; }

.bg-glow{
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(circle at 15% 0%, rgba(108,60,233,0.25), transparent 45%),
    radial-gradient(circle at 90% 20%, rgba(236,27,127,0.18), transparent 45%);
  pointer-events: none;
}

/* ---------- HEADER ---------- */
.site-header{
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(10,10,18,0.7);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--surface-border);
}
.header-inner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  height: 76px;
}
.brand-logo{ height: 30px; width:auto; display:block; }
.main-nav{
  display:flex;
  align-items:center;
  gap: 28px;
  font-size: 0.95rem;
  font-weight: 500;
}
.main-nav a{
  color: var(--text-muted);
  transition: color .2s ease;
  white-space: nowrap;
}
.main-nav a:hover{ color: #fff; }
.nav-cta{
  background: var(--grad);
  color:#fff !important;
  padding: 10px 20px;
  border-radius: 999px;
  font-weight:600;
}
.nav-toggle{
  display:none;
  flex-direction:column;
  gap:5px;
  background:none;
  border:none;
  cursor:pointer;
  padding: 6px;
}
.nav-toggle span{
  width: 24px; height: 2px;
  background: #fff;
  display:block;
  border-radius: 2px;
}
.lang-select{
  background: var(--surface);
  color: #fff;
  border: 1px solid var(--surface-border);
  border-radius: 999px;
  padding: 8px 14px;
  font-family: var(--font-body);
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--text-muted) 50%), linear-gradient(135deg, var(--text-muted) 50%, transparent 50%);
  background-position: calc(100% - 16px) center, calc(100% - 11px) center;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  padding-right: 30px;
  transition: border-color .2s ease;
}
.lang-select:hover, .lang-select:focus{ border-color: var(--pink); outline:none; }
.lang-select option{ background: var(--surface); color: #fff; }

/* ---------- BUTTONS ---------- */
.btn{
  display:inline-block;
  padding: 15px 32px;
  border-radius: 999px;
  font-weight: 600;
  font-size: 0.98rem;
  transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
  cursor:pointer;
  border: none;
}
.btn-primary{
  background: var(--grad);
  color: #fff;
  box-shadow: 0 10px 30px -8px rgba(236,27,127,0.55);
}
.btn-primary:hover{ transform: translateY(-2px); box-shadow: 0 14px 34px -6px rgba(236,27,127,0.65); }
.btn-ghost{
  background: transparent;
  color: #fff;
  border: 1.5px solid rgba(255,255,255,0.25);
}
.btn-ghost:hover{ border-color: rgba(255,255,255,0.6); }
.btn-block{ width:100%; text-align:center; }

/* ---------- HERO ---------- */
.hero{
  position: relative;
  padding: 120px 0 110px;
  min-height: 92vh;
  display:flex;
  align-items:center;
  overflow:hidden;
}
.hero-bg{ position:absolute; inset:0; z-index:0; }
.hero-bg img{
  width:100%; height:100%; object-fit: cover; object-position: center 30%;
  opacity: 0.5;
}
.hero-overlay{
  position:absolute; inset:0;
  background: linear-gradient(180deg, rgba(10,10,18,0.55) 0%, rgba(10,10,18,0.85) 60%, var(--bg) 100%),
              linear-gradient(90deg, rgba(10,10,18,0.9) 0%, rgba(10,10,18,0.35) 55%);
}
.hero-content{ position:relative; z-index:1; max-width: 760px; }
.eyebrow{
  text-transform: uppercase;
  letter-spacing: 0.14em;
  font-size: 0.78rem;
  font-weight:700;
  color: var(--pink-soft);
  margin-bottom: 18px;
}
.hero h1{ font-size: clamp(2.1rem, 4.4vw, 3.4rem); margin-bottom: 24px; }
.grad-text{
  background: var(--grad);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.hero-lead{ font-size: 1.12rem; color: #d7d9e6; }
.hero-sub{ font-size: 0.98rem; }
.hero-tagline{
  font-family: var(--font-display);
  font-weight:600;
  color:#fff;
  font-size: 1.05rem;
  margin-bottom: 34px;
}
.hero-actions{ display:flex; gap:16px; flex-wrap:wrap; }

/* ---------- SECTIONS ---------- */
.section{ padding: 96px 0; }
.section-alt{ background: var(--bg-alt); }
.section-title{ text-align:center; margin-bottom: 56px; }
.lead{ font-size: 1.15rem; color:#d7d9e6; }
.highlight{
  font-family: var(--font-display);
  font-weight:600;
  color:#fff;
  font-size: 1.1rem;
}

/* ---------- DIFFERENTIATORS ---------- */
.section-diff{ background: var(--bg-alt); }
.diff-grid{
  display:grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 24px;
  margin-bottom: 48px;
}
.diff-card{
  background: linear-gradient(160deg, rgba(108,60,233,0.14), rgba(236,27,127,0.09));
  border: 1px solid var(--surface-border);
  border-radius: var(--radius);
  padding: 36px;
}
.diff-icon{ font-size: 2rem; margin-bottom: 16px; }
.diff-card h3{ margin-bottom: 14px; }
.diff-card p{ margin-bottom: 0; }
.diff-stat{
  display:flex;
  align-items:baseline;
  gap: 14px;
  margin-top: 24px;
  padding-top: 22px;
  border-top: 1px solid var(--surface-border);
}
.diff-stat-num{
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 2.6rem;
  background: var(--grad);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  line-height:1;
}
.diff-stat-label{
  color: var(--text-muted);
  font-size: 0.9rem;
  max-width: 220px;
  line-height:1.4;
}
.diff-highlights{
  display:grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
}
.diff-highlight{
  text-align:center;
  padding: 28px 18px;
  border-radius: var(--radius);
  background: var(--surface);
  border: 1px solid var(--surface-border);
}
.diff-highlight-icon{
  width: 46px; height:46px;
  margin: 0 auto 16px;
  border-radius: 50%;
  background: var(--grad);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size: 1.3rem;
}
.diff-highlight h4{ margin-bottom: 8px; font-size: 1rem; }
.diff-highlight p{ margin:0; font-size: 0.9rem; }

/* ---------- FEATURE GRID ---------- */
.feature-grid{
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
}
.feature-card{
  background: var(--surface);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius);
  padding: 32px;
  transition: transform .25s ease, border-color .25s ease;
}
.feature-card:hover{ transform: translateY(-4px); border-color: rgba(236,27,127,0.4); }
.feature-card-wide{ grid-column: span 3; }
.feature-icon{ font-size: 1.8rem; margin-bottom: 14px; }
.feature-card h3{ margin-bottom: 12px; }
.feature-list-label{
  color:#fff; font-weight:600; margin-bottom: 8px; font-size:0.92rem;
}
.feature-list{
  list-style: none;
  margin: 0 0 16px;
  padding: 0;
  display:grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px 24px;
}
.feature-list li{
  color: var(--text-muted);
  font-size: 0.95rem;
  padding-left: 20px;
  position: relative;
}
.feature-list li::before{
  content: "";
  position:absolute; left:0; top: 0.55em;
  width:8px; height:8px;
  border-radius:50%;
  background: var(--grad);
}
.feature-note{
  font-style: italic;
  color: var(--pink-soft);
  margin:0;
}

/* ---------- PILLARS ---------- */
.pillars{
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
}
.pillar{
  background: linear-gradient(160deg, rgba(108,60,233,0.12), rgba(236,27,127,0.08));
  border: 1px solid var(--surface-border);
  border-radius: var(--radius);
  padding: 36px 28px;
}
.pillar-tag{
  display:inline-block;
  font-family: var(--font-display);
  font-weight:700;
  font-size: 1rem;
  color:#fff;
  background: var(--grad);
  padding: 6px 18px;
  border-radius: 999px;
  margin-bottom: 18px;
}
.pillar p{ margin:0; }

/* ---------- CONTROL SECTION ---------- */
.section-control{ padding: 100px 0; }
.control-inner{
  display:grid;
  grid-template-columns: 220px 1fr;
  gap: 48px;
  align-items:center;
}
.control-photo img{
  width: 200px; height:200px;
  object-fit: cover;
  border-radius: 50%;
  border: 3px solid transparent;
  background: var(--grad);
  padding: 4px;
  background-clip: padding-box;
  box-shadow: 0 0 0 3px rgba(236,27,127,0.25), 0 20px 50px -10px rgba(108,60,233,0.4);
}
.control-text p:last-child{ margin-bottom:0; }

/* ---------- WHY GRID ---------- */
.why-grid{
  display:grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 20px 40px;
  max-width: 920px;
  margin: 0 auto;
}
.why-item{
  display:flex;
  gap: 16px;
  align-items:flex-start;
}
.why-check{
  flex-shrink:0;
  width: 30px; height:30px;
  border-radius: 50%;
  background: var(--grad);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size: 0.9rem;
  font-weight:700;
  margin-top: 2px;
}
.why-item h4{ margin-bottom: 4px; }
.why-item p{ margin:0; font-size: 0.95rem; }

/* ---------- CLOSING ---------- */
.closing-section{ text-align:center; }
.closing-tagline{
  font-family: var(--font-display);
  font-size: 1.3rem;
  font-weight:700;
  color:#fff;
  margin-top: 20px;
}

/* ---------- CONTACT ---------- */
.section-contact{ background: var(--bg-alt); }
.contact-form{
  margin-top: 40px;
  text-align:left;
  display:flex;
  flex-direction:column;
  gap: 16px;
}
.form-row{ display:grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.contact-form input,
.contact-form textarea{
  width:100%;
  background: var(--surface);
  border: 1px solid var(--surface-border);
  border-radius: 12px;
  padding: 14px 16px;
  color: #fff;
  font-family: var(--font-body);
  font-size: 0.95rem;
  resize: vertical;
}
.contact-form input:focus,
.contact-form textarea:focus{
  outline:none;
  border-color: var(--pink);
}
.contact-form input::placeholder,
.contact-form textarea::placeholder{ color: #6c6f82; }
.form-note{
  text-align:center;
  color: var(--pink-soft);
  font-weight:600;
  min-height: 1.4em;
}
.contact-alt{
  margin-top: 28px;
  color: var(--text-muted);
  font-size: 0.95rem;
}
.contact-alt a{ color: var(--pink-soft); font-weight:600; }
.contact-alt .dot{ margin: 0 10px; opacity:0.5; }

/* ---------- FOOTER ---------- */
.site-footer{
  padding: 40px 0;
  border-top: 1px solid var(--surface-border);
}
.footer-inner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap: 16px;
}
.footer-logo{ height: 22px; opacity: 0.85; }
.site-footer p{ margin:0; font-size: 0.85rem; }

/* ---------- RESPONSIVE ---------- */
@media (max-width: 900px){
  .feature-grid{ grid-template-columns: repeat(2,1fr); }
  .feature-card-wide{ grid-column: span 2; }
  .pillars{ grid-template-columns: 1fr; }
  .control-inner{ grid-template-columns: 1fr; text-align:center; }
  .control-photo{ display:flex; justify-content:center; }
  .diff-grid{ grid-template-columns: 1fr; }
  .diff-highlights{ grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 720px){
  .main-nav{
    position:absolute;
    top: 76px; left:0; right:0;
    background: rgba(10,10,18,0.97);
    backdrop-filter: blur(14px);
    flex-direction:column;
    align-items:flex-start;
    padding: 20px 24px 28px;
    gap: 18px;
    border-bottom: 1px solid var(--surface-border);
    transform: translateY(-8px);
    opacity:0;
    pointer-events:none;
    transition: all .25s ease;
  }
  .main-nav.open{ transform: translateY(0); opacity:1; pointer-events:auto; }
  .nav-toggle{ display:flex; }
  .nav-cta{ margin-top: 4px; }
  .feature-grid{ grid-template-columns: 1fr; }
  .feature-card-wide{ grid-column: span 1; }
  .feature-list{ grid-template-columns: 1fr; }
  .why-grid{ grid-template-columns: 1fr; }
  .form-row{ grid-template-columns: 1fr; }
  .hero{ padding: 100px 0 80px; text-align:left; }
  .diff-highlights{ grid-template-columns: 1fr; }
}

</style>
</head>

<script>
document.addEventListener('DOMContentLoaded', function () {

  var DEFAULT_LANG = 'en';

  function getPath(obj, path) {
    return path.split('.').reduce(function (o, k) { return (o && o[k] !== undefined) ? o[k] : undefined; }, obj);
  }

  function applyLanguage(lang) {
    if (!translations[lang]) lang = DEFAULT_LANG;
    document.documentElement.setAttribute('lang', lang);

    document.querySelectorAll('[data-i18n]').forEach(function (el) {
      var val = getPath(translations[lang], el.getAttribute('data-i18n'));
      if (typeof val === 'string') el.textContent = val;
    });

    document.querySelectorAll('[data-i18n-placeholder]').forEach(function (el) {
      var val = getPath(translations[lang], el.getAttribute('data-i18n-placeholder'));
      if (typeof val === 'string') el.placeholder = val;
    });

    document.querySelectorAll('[data-i18n-list]').forEach(function (el) {
      var arr = getPath(translations[lang], el.getAttribute('data-i18n-list'));
      if (Array.isArray(arr)) {
        el.innerHTML = '';
        arr.forEach(function (item) {
          var li = document.createElement('li');
          li.textContent = item;
          el.appendChild(li);
        });
      }
    });

    document.querySelectorAll('.lang-select').forEach(function (sel) {
      sel.value = lang;
    });

    // reset the demo-only success message when switching language
    var note = document.getElementById('form-note');
    if (note) note.textContent = '';
  }

  // Language selector(s)
  document.querySelectorAll('.lang-select').forEach(function (sel) {
    sel.addEventListener('change', function (e) {
      applyLanguage(e.target.value);
    });
  });

  applyLanguage(DEFAULT_LANG);

  // Mobile nav toggle
  var toggle = document.getElementById('nav-toggle');
  var nav = document.getElementById('main-nav');
  if (toggle && nav) {
    toggle.addEventListener('click', function () {
      nav.classList.toggle('open');
    });
    nav.querySelectorAll('a').forEach(function (link) {
      link.addEventListener('click', function () {
        nav.classList.remove('open');
      });
    });
  }

  // Footer year
  var yearEl = document.getElementById('year');
  if (yearEl) yearEl.textContent = new Date().getFullYear();

  // Contact form (placeholder handling — no backend connected yet)
  var form = document.getElementById('contact-form');
  var note = document.getElementById('form-note');
  if (form) {
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var lang = document.documentElement.getAttribute('lang') || DEFAULT_LANG;
      note.textContent = getPath(translations[lang], 'contact.success') || '';
      form.reset();
    });
  }
});

</script>
